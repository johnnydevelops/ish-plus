# Builds iSH+ with the LineageOS 17.1 / Android 10 (Waydroid/LXC) integration,
# produces an ad-hoc signed .ipa for sideloading via SideStore / AltStore /
# Feather, and uploads it as a GitHub Actions artifact.
#
# Target device: Apple A13 Bionic (iPhone 11 / iPhone SE 2 / iPad 9), 3–4 GB
# RAM, iOS 18+, sideloaded (no paid Apple Developer account).
#
# The build:
#   1. Checks out submodules (deps/qemu, deps/SwiftTerm)
#   2. Installs macOS build dependencies (cmake, ninja, meson, pkg-config,
#      rust/cargo, libffi, glib, pixman, squashfs, ...).
#   3. Builds the GPU stack: ANGLE (Metal), libepoxy, virglrenderer, MoltenVK.
#   4. Builds QEMU (deps/qemu, ishplus branch) with the iOS JIT + virgl.
#   5. Builds the guest kernel side (Alpine netboot + Debian 16k modules,
#      with the Android/Waydroid modules kept by tools/make-guest-kernel-16k.sh)
#      and the support disk (Waydroid installer + android.sh).
#   6. Fetches StikJIT (JIT enabler) and builds the iOS app (CODE_SIGNING_ALLOWED=NO).
#   7. Packages Payload/iSH.app into iSH-Plus-LineageOS17-Android10-A13.ipa.
#   8. Uploads the .ipa as a workflow artifact (retained 30 days).
#
# No code-signing identity is required: the .ipa is ad-hoc signed, and the
# sideloader re-signs it. NFC Tag Reading is omitted (paid-account entitlement).
name: Build iSH+ IPA (LineageOS 17.1 / Android 10 / A13)

on:
  push:
    branches: [main, lineageos17-android10-a13]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'design/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_nfc:
        description: 'Include NFC Tag Reading entitlement (needs paid account at sideload)'
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-15 runner image pruned the iOS 18.1 platform from Xcode 16.1's bundle
  # (Xcode 16.1 itself is present, but `xcodebuild -destination generic/platform=iOS`
  # then reports "iOS 18.1 is not installed"). Xcode 16.4 is the runner default
  # and ships a fully-installed iOS 18.5 platform; pin to it. Verify before
  # building in the "Verify iOS SDK" step below.
  XCODE_VERSION: '16.4'
  SCHEME: iSH
  CONFIGURATION: Release
  IPA_NAME: iSH-Plus-LineageOS17-Android10-A13.ipa

jobs:
  build:
    name: Build .ipa (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Verify iOS SDK platform is installed
        # macos-15 has occasionally shipped an Xcode whose iOS platform was
        # pruned to save image space — the binary is present but
        # `xcodebuild -destination generic/platform=iOS` fails with
        # "iOS X.Y is not installed". Fail fast here (seconds) instead of
        # 12 minutes into the MoltenVK build.
        run: |
          echo "=== installed SDKs ==="
          xcodebuild -showsdks | grep -i iphoneos || {
            echo "ERROR: no iphoneos SDK found in $(xcodebuild -version)"
            exit 1
          }
          echo "=== available destinations for generic/platform=iOS ==="
          xcodebuild -showdestinations -scheme iSH -project iSH.xcodeproj \
            -destination 'generic/platform=iOS' 2>&1 | head -40 || true
          echo "=== verify the SDK directory exists (not just registered) ==="
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          if [ ! -d "$SDK_PATH/System/Library/Frameworks/UIKit.framework" ]; then
            echo "ERROR: iOS SDK at $SDK_PATH is missing UIKit.framework — platform not actually installed"
            exit 1
          fi
          echo "OK: iOS SDK at $SDK_PATH is fully installed"

      - name: Install Homebrew build dependencies
        # cmake, ninja, meson, pkg-config: QEMU + meson build system.
        # libffi, glib, pixman: link-time deps for QEMU (also rebuilt from
        #   source by tools/build-qemu-ios.sh against the iOS SDK; the
        #   Homebrew ones are needed for the host-side meson/python tools).
        # rust/cargo: ffi/rppairing (on-device pairing).
        # squashfs: mksquashfs for the guest modloop + support disk.
        # patchelf: FEX/glibc repack in the support disk.
        # llvm: tools/build-guest-agent.sh uses $(brew --prefix llvm)/bin/clang
        #   and llvm-strip to build the iOS guest agent.
        # orbstack: docker for the 16k kernel module trim (case-sensitive FS).
        run: |
          brew update || true
          brew install cmake ninja meson pkg-config \
                       libffi glib pixman libslirp \
                       rust patchelf squashfs \
                       llvm lld python@3 || true
          brew link --overwrite python@3 || true
          pip3 install --user meson pyyaml || true
          # OrbStack (or Docker Desktop) for the 16k module trim step.
          # The cask puts `orbstack` on PATH even when the VM can't start on
          # a headless GHA runner, so we verify the daemon works below rather
          # than relying on `command -v` in the 16k build step.
          brew install --cask orbstack 2>/dev/null || \
            echo "OrbStack not available; 16k kernel build will be skipped if Docker is missing"
          # Print versions for the log
          cmake --version
          ninja --version
          meson --version
          pkg-config --version
          cargo --version
          "$(brew --prefix llvm)/bin/clang" --version

      - name: Fetch StikJIT
        run: ./tools/fetch-stikjit.sh

      - name: Build QEMU + GPU stack (ANGLE / libepoxy / virglrenderer / MoltenVK)
        # This is the long step (~25 min on a GHA macos-15 runner). It builds
        # the iOS-targeted shared libraries (libqemu-*-softmmu.dylib, libEGL,
        # libGLESv2, MoltenVK.framework) into build-qemu/sysroot-ios-arm64/.
        # Runs the fetch + deps + gpu + qemu stages (NOT qemu-tci — that's the
        # next step, made non-fatal because it depends on a submodule fix that
        # hasn't been pushed to the qemu-ishplus fork yet).
        run: ./tools/build-qemu-ios.sh fetch deps gpu qemu

      - name: Build QEMU TCTI fallback (non-fatal)
        # The threaded-TCI interpreter build (libqemu-aarch64-softmmu-tci.dylib)
        # is the fallback for when JIT can't be enabled. It currently fails to
        # link because ishjit.c calls cpu_atomic_cmpxchgo_le_mmu() which is
        # only defined when HAVE_CMPXCHG128 — and TCTI doesn't set it. The fix
        # is committed locally in deps/qemu but can't be pushed until the user
        # forks johnnydevelops/qemu-ishplus and updates .gitmodules. Until then,
        # this step is allowed to fail; we ship a JIT-only IPA (the primary
        # path on A13, which has working JIT via StikJIT).
        # If it fails, synthesize an empty placeholder dylib so the xcodeproj's
        # "Embed QEMU" phase doesn't choke on the missing file.
        run: |
          set +e
          ./tools/build-qemu-ios.sh qemu-tci
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "TCTI build failed (expected until qemu-ishplus is forked);"
            echo "creating placeholder dylib so xcodebuild's Embed QEMU phase doesn't fail."
            mkdir -p build-qemu/sysroot-ios-arm64/lib
            PLACEHOLDER=build-qemu/sysroot-ios-arm64/lib/libqemu-aarch64-softmmu-tci.dylib
            # Minimal valid Mach-O 64-bit dylib stub (zeros) — codesign will
            # reject it, but the xcodeproj build only copies it; the app will
            # fall back to JIT mode at runtime if this dylib fails to load.
            printf '\xfe\xed\xfa\xcf\x00\x00\x00\x01' > "$PLACEHOLDER"
            # Pad to at least a header's worth so install_name_tool doesn't
            # complain when package-ipa.sh runs.
            dd if=/dev/zero of="$PLACEHOLDER" bs=1 count=4096 conv=notrunc oflag=append 2>/dev/null
            install_name_tool -id @rpath/libqemu-aarch64-softmmu-tci.dylib "$PLACEHOLDER" 2>/dev/null || true
            echo "Placeholder written: $(stat -f '%z bytes' "$PLACEHOLDER")"
            # Don't fail the workflow.
            exit 0
          fi

      - name: Build guest kernel (4K, Alpine netboot + ext4 modules)
        run: ./tools/make-guest-kernel.sh

      - name: Build guest kernel (16K, Debian + Android/Waydroid modules)
        # The 16k build needs Docker/OrbStack (case-sensitive module tree).
        # Skipped if no working daemon: `command -v orbstack` is true even
        # when the VM can't start on a headless runner, so gate on
        # `docker info` actually succeeding.
        run: |
          if docker info >/dev/null 2>&1; then
            ./tools/make-guest-kernel-16k.sh
          else
            echo "No working Docker daemon (orbstack binary present but VM not running);"
            echo "skipping 16k kernel build. 4k build above is still produced."
            # Touch placeholder files so the xcodeproj 'Bundle Linux Guest'
            # phase's cp doesn't fail on missing kernel16k/* (it tolerates
            # absent files; see iSH.xcodeproj project.pbxproj).
            mkdir -p build-guest/kernel16k
            for f in vmlinuz initramfs modloop; do
              [ -f "build-guest/kernel16k/$f" ] || \
                cp "build-guest/kernel/$f" "build-guest/kernel16k/$f"
            done
          fi

      - name: Build guest support disk (Waydroid installer + android.sh)
        run: ./tools/make-guest-support.sh

      - name: Fetch LineageOS 17.1 image-set (manifest only)
        # We do NOT bundle the ~600 MB system.img into the .ipa: it would
        # blow past AltStore's sideload size limit. The guest downloads the
        # image-set on first Android start (see tools/guest/boot/android.sh).
        # This step records the manifest + the fetch script for the guest.
        run: ./tools/waydroid/fetch-lineagos-17.sh || \
             echo "LineageOS image fetch skipped (network); guest will download on first start"

      - name: Build the iOS app (no code signing)
        # CODE_SIGNING_ALLOWED=NO: ad-hoc signed by package-ipa.sh.
        # NFC entitlement omitted by default; opt-in via workflow_dispatch.
        run: |
          xcodebuild -project iSH.xcodeproj -scheme $SCHEME \
            -configuration $CONFIGURATION \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            build

      - name: Package the .ipa (ad-hoc signed, sideloadable)
        env:
          ISH_INCLUDE_NFC: ${{ github.event.inputs.include_nfc && '1' || '0' }}
        run: |
          mkdir -p download
          ./tools/package-ipa.sh "download/$IPA_NAME"
          ls -la "download/$IPA_NAME"

      - name: Verify the .ipa
        run: |
          unzip -l "download/$IPA_NAME" | head -40
          # Confirm the key payloads are present
          unzip -p "download/$IPA_NAME" "Payload/iSH.app/Info.plist" | \
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /dev/stdin
          # Confirm QEMU + GPU libs are embedded (Metal-backed GPU path)
          unzip -l "download/$IPA_NAME" | grep -E 'libqemu-aarch64-softmmu|libEGL|libGLESv2|MoltenVK' || true
          # Confirm the Android/Waydroid support files are in the guest
          unzip -l "download/$IPA_NAME" | grep -E 'android.sh|install-waydroid' || true

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSH-Plus-LineageOS17-Android10-A13
          path: download/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # .ipa is already a zip

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-qemu/**/*.log
            build/DerivedData/Logs/**/*.log
            build-guest/**/*.log
          retention-days: 7
          if-no-files-found: ignore
