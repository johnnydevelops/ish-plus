			shellScript = "# GPU acceleration, when tools/build-qemu-ios.sh built its gpu stage: ANGLE\n# (libEGL, libGLESv2) and MoltenVK, next to QEMU. Without them, iSH+ has no\n# GPU switches (VMSettings.gpuAvailable).\nset -e\nL=\"$SRCROOT/build-qemu/sysroot-ios-arm64/lib\"\nF=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"\nmkdir -p \"$F\"\nfor f in libEGL.dylib libGLESv2.dylib MoltenVK.framework; do\n  rm -rf \"$F/$f\"\n  [ -e \"$L/$f\" ] || continue\n  cp -R \"$L/$f\" \"$F/\"\n  rm -rf \"$F/$f/Headers\"\n  if [ \"$CODE_SIGNING_ALLOWED\" = YES ] && [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ]; then\n    codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --preserve-metadata=identifier,flags \"$F/$f\"\n  fi\ndone\n";
		};
